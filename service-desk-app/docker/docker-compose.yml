services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXUS_INTEGRATION: ${NEXUS_INTEGRATION:-}
        NEXT_PUBLIC_NEXUS_INTEGRATION: ${NEXUS_INTEGRATION:-}
        SERVICE_DESK_BASE_PATH: ${SERVICE_DESK_BASE_PATH:-}
    environment:
      JWT_ALGORITHM: ${JWT_ALGORITHM:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      NEXUS_ADMIN_CHECK_URL: ${NEXUS_ADMIN_CHECK_URL:-}
      NEXUS_INTEGRATION: ${NEXUS_INTEGRATION:-}
      NEXT_PUBLIC_BASE_PATH: ${SERVICE_DESK_BASE_PATH:-}
      NEXT_PUBLIC_NEXUS_INTEGRATION: ${NEXUS_INTEGRATION:-}
      NODE_ENV: production
      SERVICE_DESK_BASE_PATH: ${SERVICE_DESK_BASE_PATH:-}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider "http://127.0.0.1:3000$${SERVICE_DESK_BASE_PATH:-}/api/health" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
      POSTGRES_USER: ${POSTGRES_USER:-service_desk}
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-service_desk} -d $${POSTGRES_DB:-service_desk}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - service-desk-postgres:/var/lib/postgresql/data

volumes:
  service-desk-postgres:
