quiz_title: Nexus Beginner Stage 2 — Checkpoint Bank
certification: nexus_beginner_aplus
certification_version: nexus_beginner_aplus_v1
domain: S2
module: module.nexus.beginner.stage2
questions:
  - group: s2-inside
    objective_code: B2.1
    text: What does the central processing unit (CPU) do?
    choices: ["Holds active work temporarily", "Processes instructions", "Keeps saved files after power is off", "Supplies electrical power to parts"]
    answer: 1
    explanation: The CPU carries out instructions; RAM holds active work, storage keeps saved files, and the power supply provides electricity.
    review: true
  - group: s2-inside
    objective_code: B2.1
    text: What is Random Access Memory (RAM) used for?
    choices: ["Processes instructions for the computer", "Keeps saved files after power is off", "Short-term working space for active tasks", "Supplies electrical power to the computer"]
    answer: 2
    explanation: RAM holds active work temporarily and clears when power is off.
    review: true
  - group: s2-inside
    objective_code: B2.1
    text: Where should a saved document remain after the computer is turned off?
    choices: ["RAM alone", "The central processing unit", "The motherboard", "Storage such as a solid-state drive"]
    answer: 3
    explanation: Storage keeps saved files after power is off; RAM does not.
    review: true
  - group: s2-inside
    objective_code: B2.1
    text: You type a letter and see it on screen. Which order fits?
    choices: ["Screen input; processing; keyboard output", "Keyboard input; screen output; then processing", "Keyboard output; processing; screen input", "Keyboard input; processing; screen output"]
    answer: 3
    explanation: The keyboard supplies input, the computer processes it, and the screen displays output.
  - group: s2-inside
    objective_code: B2.1
    text: What is the motherboard's basic job?
    choices: ["Connect the main computer parts", "Holds active work temporarily", "Keeps saved files after power is off", "Supplies electrical power to parts"]
    answer: 0
    explanation: The motherboard is the main board that connects the parts.
  - group: s2-connections
    objective_code: B2.2
    text: What is a peripheral?
    choices: ["The computer's operating system", "A connected device such as a mouse or printer", "A saved document", "A user's account"]
    answer: 1
    explanation: A mouse or printer connects to the computer to help with a task; it is a peripheral rather than an internal main part.
  - group: s2-connections
    objective_code: B2.2
    text: What is a port on a computer?
    choices: ["A cable end that goes into a socket", "An application window on the screen", "A socket for a matching cable or accessory", "A folder containing saved files"]
    answer: 2
    explanation: A port is a physical connection point; never force a plug into it.
  - group: s2-connections
    objective_code: B2.2
    text: Which port commonly carries a picture to a monitor?
    choices: ["High-Definition Multimedia Interface (HDMI)", "A round audio socket for headphones", "A common rectangular USB port for a keyboard", "The computer’s power button"]
    answer: 0
    explanation: HDMI commonly carries a picture to a monitor; a round audio socket serves headphones, while a common rectangular USB port serves matching accessories.
  - group: s2-connections
    objective_code: B2.2
    text: A monitor is blank. What is a safe first check?
    choices: ["Open the power supply", "Ask whether it has power and the correct input is selected", "Force a cable into a similar-looking port", "Replace the motherboard without asking"]
    answer: 1
    explanation: Power and input selection are safe checks before any disruptive action.
  - group: s2-connections
    objective_code: B2.2
    text: You notice a burning smell near a computer. What should you do?
    choices: ["Open the power supply", "Keep using it until it stops", "Stop and ask a trained technician for help", "Touch damaged wiring to check it"]
    answer: 2
    explanation: Damage or a burning smell is a reason to stop; do not open a power supply.
  - group: s2-files-apps
    objective_code: B2.3
    text: What is a file?
    choices: ["Saved information such as a photo or document", "The application used to write a document", "A folder that organizes documents", "An account used to sign in"]
    answer: 0
    explanation: A file is saved information. An application can open or create it.
    review: true
  - group: s2-files-apps
    objective_code: B2.3
    text: What is a folder for?
    choices: ["Opening and editing a document", "Holding active work temporarily", "Grouping files so they are easier to find", "Identifying who is signed in"]
    answer: 2
    explanation: A folder organizes files; it is not the same thing as an application.
  - group: s2-files-apps
    objective_code: B2.3
    text: What is an application?
    choices: ["A saved document", "A storage drive", "A physical connector", "Software opened to do a task"]
    answer: 3
    explanation: An application is a tool such as a document editor or browser.
  - group: s2-files-apps
    objective_code: B2.3
    text: Someone says “my document is gone.” What should you ask first?
    choices: ["Should I reinstall the document application first?", "Should I search another user’s files without asking?", "Should I delete the empty folders?", "Which document and where did you last save it?"]
    answer: 3
    explanation: Clarify whether the file is missing before changing an application or device.
  - group: s2-files-apps
    objective_code: B2.3
    text: Which pair correctly names a file and an application?
    choices: ["report.txt is a file; a document editor is an application", "report.txt is an application; a document editor is a file", "report.txt is a folder; a document editor is a file", "report.txt is an account; a document editor is a folder"]
    answer: 0
    explanation: The editor is software for work; report.txt is saved information.
