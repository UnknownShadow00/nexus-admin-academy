quiz_title: Nexus Beginner Stage 1 — Checkpoint Bank
certification: nexus_beginner_aplus
certification_version: nexus_beginner_aplus_v1
domain: S1
module: module.nexus.beginner.stage1
questions:
  - group: s1-supports
    objective_code: B1.1
    text: What does IT help people do at work?
    choices: ["Use computers and information safely and reliably", "Replace every broken object in a building", "Make every business decision", "Avoid asking users questions"]
    answer: 0
    explanation: IT supports the tools and information people need for work.
    review: true
  - group: s1-supports
    objective_code: B1.1
    text: Which example is hardware?
    choices: ["A keyboard", "A web browser", "A calendar application", "A sign-in account"]
    answer: 0
    explanation: Hardware is a physical part you can touch.
    review: true
  - group: s1-supports
    objective_code: B1.1
    text: Which example is software?
    choices: ["A web browser", "A screen", "A mouse", "A power cable"]
    answer: 0
    explanation: A browser is an application made of instructions the device runs.
    review: true
  - group: s1-supports
    objective_code: B1.1
    text: A worker can use a laptop but cannot sign in. Which area should support consider first?
    choices: ["The worker's account", "The screen's color", "The laptop case", "The keyboard shape"]
    answer: 0
    explanation: Sign-in problems often involve the account. Support should ask a few questions before deciding.
  - group: s1-supports
    objective_code: B1.1
    text: A worker says a calendar will not open. What is a useful first question?
    choices: ["Does it fail only on this device or on others too?", "Should I replace the laptop immediately?", "Can I close the request now?", "What model of desk do you have?"]
    answer: 0
    explanation: Comparing devices helps separate an application issue from a device or account issue.
  - group: s1-support-work
    objective_code: B1.2
    text: What should a support technician do before changing a setting?
    choices: ["Ask what the person expected and what happened", "Change several settings to save time", "Assume the user caused it", "Say it is fixed"]
    answer: 0
    explanation: The symptom and expected result guide a safe check.
  - group: s1-support-work
    objective_code: B1.2
    text: Why check one possibility at a time?
    choices: ["You can tell which check helped", "It always fixes the problem", "It removes the need to ask questions", "It proves the user was wrong"]
    answer: 0
    explanation: Multiple changes at once make the cause harder to understand.
  - group: s1-support-work
    objective_code: B1.2
    text: What is a help desk?
    choices: ["A team or place where people ask for technology help", "A table that holds computer parts", "A program that stores photos", "A cable between computers"]
    answer: 0
    explanation: A help desk connects people with support technicians.
  - group: s1-support-work
    objective_code: B1.2
    text: After a safe check, what should the technician do?
    choices: ["Test the result and tell the person what was found", "Assume it worked and leave", "Delete the person's files", "Change another setting without checking"]
    answer: 0
    explanation: Verification shows whether the check actually helped.
  - group: s1-support-work
    objective_code: B1.2
    text: A user is confused by a support explanation. What is the best response?
    choices: ["Explain the next step in plain language", "Use more unexplained terms", "Ignore the question", "Claim the problem is solved"]
    answer: 0
    explanation: Clear updates help the person know what is happening.
  - group: s1-safe-thinking
    objective_code: B1.3
    text: You restarted an application but the user has not tested it. What is an honest update?
    choices: ["I restarted it; the result still needs to be checked", "It is fixed and verified", "There was never a problem", "I completed every check"]
    answer: 0
    explanation: Trying a change is not proof that it solved the problem.
  - group: s1-safe-thinking
    objective_code: B1.3
    text: What does it mean to verify a fix?
    choices: ["Check whether the original problem is gone", "Guess that the change worked", "Repeat the user's complaint", "Close the request without testing"]
    answer: 0
    explanation: Verification compares the result with the original problem.
  - group: s1-safe-thinking
    objective_code: B1.3
    text: The next change might erase a user's work. What should you do?
    choices: ["Pause and ask an experienced technician", "Try it quickly", "Hide the risk from the user", "Tell the user it already worked"]
    answer: 0
    explanation: Possible data loss is a reason to stop and get appropriate help.
  - group: s1-safe-thinking
    objective_code: B1.3
    text: What is escalating a problem?
    choices: ["Passing it to someone with the right skill or permission", "Blaming the user", "Closing it without checking", "Making several random changes"]
    answer: 0
    explanation: Escalation is a responsible way to get the right help.
  - group: s1-safe-thinking
    objective_code: B1.3
    text: Which sequence is a careful first approach to a problem?
    choices: ["Ask what happened; check one safe possibility; test the result", "Change many settings; then ask", "Say it is fixed; then test", "Restart every device without asking"]
    answer: 0
    explanation: Gather the symptom, make one safe check, and verify what changed.
