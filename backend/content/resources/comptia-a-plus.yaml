# Nexus V2 learning resources for CompTIA A+ (Phase 1B fixture).
#
# DATA. The V2 content loader (`load_resources`) upserts this idempotently
# keyed on `resource_key`. URLs, providers, and permission status live here,
# never hardcoded in application code. `permission_status` is one of
# owned | permitted | requested | unknown | denied. A resource is *support*
# for a lesson, never a replacement.

resources:
  - resource_key: res.aplus.core1.tcp_udp_ports.pcnet_video
    title: "TCP and UDP Explained"
    resource_type: video
    provider: "PowerCert Animated Videos"
    url: "https://www.youtube.com/watch?v=uwoD5YsGACg"
    duration: "6m"
    certification_version: comptia_aplus_220-1201
    source_name: "PowerCert Animated Videos (YouTube)"
    source_url: "https://www.youtube.com/@PowerCertAnimatedVideos"
    permission_status: unknown
    license_note: "Public YouTube video; linked, not embedded or re-hosted."
    active: true
    links:
      - lesson_key: lesson.aplus.core1.networking_fundamentals.tcp_udp_ports
        required: true
        order: 1

  - resource_key: res.aplus.core1.common_ports.reference_table
    title: "CompTIA A+ Common Ports Reference"
    resource_type: reference
    provider: "Professor Messer"
    url: "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-video/common-network-ports-220-1201/"
    certification_version: comptia_aplus_220-1201
    source_name: "Professor Messer 220-1201 course notes"
    source_url: "https://www.professormesser.com/"
    permission_status: permitted
    license_note: "Free training resource; linked with attribution."
    active: true
    links:
      - lesson_key: lesson.aplus.core1.networking_fundamentals.tcp_udp_ports
        required: false
        order: 2
      - module_key: module.aplus.core1.networking_fundamentals
        required: false
        order: 1

