- prompt_key: explain.aplus.m14.managed_mobile_wifi
  title: Explain how to troubleshoot managed mobile Wi-Fi without weakening security
  module_key: module.aplus.core2.connected_endpoint_mobile_security
  objectives:
  - '2.3'
  - '2.8'
  - '3.3'
  expected_concepts:
  - scope and known-good comparison
  - managed profile/certificate
  - MDM compliance
  - no encryption downgrade/profile bypass
  - approved re-push/re-enrollment
  - verify original task
  minimum_concepts: 4
  rubric:
    approved_text: Walks through evidence, managed remediation, preserved security
      posture, and verification.
    minimum_concepts: 4
    must_include: []
