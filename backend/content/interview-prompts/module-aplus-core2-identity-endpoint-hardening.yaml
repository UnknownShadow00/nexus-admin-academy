- prompt_key: explain.aplus.m13.safe_elevation
  title: Explain safe elevation for an approved task
  module_key: module.aplus.core2.identity_endpoint_hardening
  objectives:
  - '2.1'
  - '2.2'
  - '2.7'
  expected_concepts:
  - verify request/software
  - least privilege
  - approved temporary/scoped elevation
  - do not disable controls
  - verify and document
  minimum_concepts: 4
