prompts:
- id: E01
  objectives:
  - '4.1'
  prompt: What makes a ticket note useful to the next technician?
  expected_concepts:
  - reported symptom/context
  - evidence/tests
  - actions and results
  - current state or root cause when known
  - verification
  - next step/handoff
  minimum_for_pass: 4
  prompt_key: interview.aplus.core2.service.desk.workflow.e01
  rubric_version: module5-explain-v2
  rubric:
    minimum_for_pass: 4
    partial_credit: 'Give credit for technically equivalent wording. Do not require
      exact sentences. Missing all verification/next-action thinking should cap a
      response below full credit.

      '
  certification_version: comptia_aplus_220-1202
  module: module.aplus.core2.service_desk_workflow
  domain: '4.0'
  importance: working_knowledge
- id: E02
  objectives:
  - '4.1'
  prompt: When should you escalate a ticket instead of continuing to troubleshoot?
  expected_concepts:
  - scope/skill boundary
  - permissions or approval boundary
  - security/safety risk
  - SLA/business impact or policy stop point
  - complete evidence-rich handoff
  minimum_for_pass: 3
  prompt_key: interview.aplus.core2.service.desk.workflow.e02
  rubric_version: module5-explain-v2
  rubric:
