scenarios:
- stable_key: service_desk.aplus.mobile.intermittent_charge_mail_sync
  title: Field Phone Charges Intermittently and Mail Stopped Syncing
  description: My phone only charges if I hold the cable at an angle, and this morning
    my company mail stopped updating. I have a trip this afternoon. Can you just reset
    the whole phone?
  category: service_desk
  difficulty: 1
  definition:
    id: SERVICE_DESK.APLUS.MOBILE.INTERMITTENT_CHARGE_MAIL_SYNC
    title: Field Phone Charges Intermittently and Mail Stopped Syncing
    slug: service_desk.aplus.mobile.intermittent_charge_mail_sync
    category: service_desk
    priority: medium
    difficulty: easy
    pointValue: 100
    explanation: 'Authorized repair/replacement for the physical charging-port fault
      plus verified mail-sync remediation.

      Safe escalation/replacement if physical condition becomes unsafe.

      Mail issue escalated to the MDM/app owner with complete evidence if the technician
      lacks authority.'
    description:
      issue: My phone only charges if I hold the cable at an angle, and this morning
        my company mail stopped updating. I have a trip this afternoon. Can you just
        reset the whole phone?
      reportedByLine: Jordan Lee
      businessImpact: The user can continue work from a laptop now, but needs reliable
        mobile mail and charging during travel later today.
      troubleshooting:
      - The phone is company-managed.
      - Wi-Fi browsing works at the time the ticket is opened.
      - A second known-good approved charging cable behaves the same way.
      - No swelling or liquid exposure has been reported, but the port has visible
        wear.
      - Calendar is updating; mail is stale.
      - Factory reset requires approval and is not a first-line action.
      - Clarify whether charging failure follows multiple approved cables/chargers
        and whether angle/port movement changes it.
      - Ask about swelling, overheating, liquid exposure, drops, debris, or other
        safety signs.
      - Confirm Wi-Fi/cellular status and whether other business apps/sync categories
        work.
      - Check work-account/app/MDM status and recent policy/app changes available
        to the technician.
      - Separate the physical charging symptom from the mail-sync symptom.
      - Recognize that angle-dependent charging with a known-good cable points toward
        port/physical connection damage.
      - Recognize that working browsing plus selective mail failure points toward
        mail app/account/sync/management state rather than total network failure.
      - Do not force the port or factory-reset the phone as the first action.
      - If unsafe battery/liquid/heat signs appear, stop normal use/charging and escalate
        under the safety procedure.
      - For the worn port, arrange authorized repair/replacement or temporary approved
        charging alternative if the organization supports one.
      - For mail sync, perform only approved account/app sync, update, or MDM-guided
        remediation within the technician's permissions; escalate if policy/management
        control requires higher authority.
      - Verify stable charging without cable pressure/unsafe manipulation OR document
        that repair/replacement is pending and the device should not be relied on.
      - Send/receive or refresh a test work message using the approved verification
        method.
      - Confirm the user's required mobile workflow is restored or clearly state the
        handoff/pending state.
      - Record both symptoms separately, evidence collected, safe actions, MDM/approval
        boundary, verification, and user-facing next step.
      - Do not record credentials or private message content.
