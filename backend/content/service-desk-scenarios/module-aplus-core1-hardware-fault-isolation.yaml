scenarios:
- stable_key: service_desk.aplus.hardware.render_shutdown
  title: Design Workstation Shuts Down During Long Renders
  description: The workstation powers off abruptly 10–20 minutes into long 3D renders.
    Normal email/web work is stable.
  category: service_desk
  difficulty: 1
  definition:
    id: SERVICE_DESK.APLUS.HARDWARE.RENDER_SHUTDOWN
    title: Design Workstation Shuts Down During Long Renders
    slug: service_desk.aplus.hardware.render_shutdown
    category: service_desk
    priority: medium
    difficulty: easy
    pointValue: 100
    explanation: 'Approved airflow/cleaning/cooling correction with sustained verification.

      Hardware/cooling replacement escalation with complete evidence if component
      service is outside student role.'
    description:
      issue: The workstation powers off abruptly 10–20 minutes into long 3D renders.
        Normal email/web work is stable.
      reportedByLine: Mina Patel
      businessImpact: Design exports are delayed and unsaved render progress is lost.
      troubleshooting:
      - Workstation is otherwise stable at idle/light load.
      - Monitoring snapshot shows CPU temperature rising to its thermal limit before
        shutdown.
      - Fans become unusually loud under the same workload.
      - Case intake vents have heavy dust buildup.
      - No burning smell, smoke, swollen capacitor, or PSU alarm is supplied.
      - Confirm load correlation and collect temperature/fan/shutdown evidence.
      - Inspect airflow/vent/fan state with system powered down before physical service.
      - Review recent hardware changes and ensure no immediate electrical-danger indicators
        are present.
      - Rank thermal/cooling fault first based on the supplied correlation.
      - Keep PSU/RAM/board failure as secondary only if follow-up evidence supports
        them.
      - Power down and use approved cleaning/airflow/fan/heatsink remediation within
        role OR escalate hardware replacement.
      - Do not open the PSU or replace several parts at once.
      - Repeat the original render or approved equivalent while monitoring temperature
        and stability.
      - Confirm sustained operation beyond the prior failure window.
      - Record pre-fix temperature/symptom, physical evidence, action/escalation,
        post-fix temperature/stability, and user update.
