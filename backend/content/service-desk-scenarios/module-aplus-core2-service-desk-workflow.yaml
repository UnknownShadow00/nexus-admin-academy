scenarios:
- stable_key: curriculum-aplus-core2-service-desk-workflow-service-desk-01
  title: Shared Calendar Access Before Orientation
  description: I can sign in to email, but the Facilities scheduling calendar is missing.
    I need it for a meeting soon.
  category: service_desk
  difficulty: 1
  definition:
    id: CURRICULUM-APLUS-CORE2-SERVICE-DESK-WORKFLOW-SERVICE-DESK-01
    title: Shared Calendar Access Before Orientation
    slug: curriculum-aplus-core2-service-desk-workflow-service-desk-01
    category: service_desk
    priority: low
    difficulty: easy
    pointValue: 100
    explanation: If approval is unavailable, a complete escalation/pending handoff
      with a user update is a correct professional outcome. Unauthorized access is
      not.
    description:
      issue: I can sign in to email, but the Facilities scheduling calendar is missing.
        I need it for a meeting soon.
      reportedByLine: New Facilities Coordinator
      businessImpact: The employee can continue orientation, but cannot perform scheduling
        duties.
      troubleshooting:
      - The user asks the technician to 'just add me now,' but the approval required
        by the SOP is not yet recorded.
      - Confirm requester identity, role, affected service, business impact, and device/session
        information.
      - Check the relevant onboarding/access SOP and compare the intended access to
        an approved peer role.
      - Do not assume the missing calendar is an application failure.
      - Identify this as missing authorized access rather than general sign-in failure.
      - Recognize that the technician cannot bypass the approval requirement.
      - Follow the approved escalation/authorization path.
      - After approval, perform or hand off the approved access change according to
        role permissions.
      - Have the user refresh/restart the calendar client as appropriate.
      - Confirm the shared calendar is visible and the required scheduling action
        works.
      - Remove any test item created solely for verification.
      - Record the symptom, impact, approval path, action/hand-off, and verification.
      - Send a plain-language user update with realistic timing.
      - Close only after verification or leave a clear pending/escalated state.
