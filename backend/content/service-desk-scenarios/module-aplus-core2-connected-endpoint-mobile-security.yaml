scenarios:
- stable_key: sd.aplus.security.mobile_secure_wifi_profile
  title: Managed Phone Cannot Rejoin Secure Wi-Fi After Profile Update
  description: The phone stopped joining the corporate secure SSID after an approved
    Wi-Fi/certificate profile update.
  category: service_desk
  difficulty: 1
  definition:
    id: SD.APLUS.SECURITY.MOBILE_SECURE_WIFI_PROFILE
    title: Managed Phone Cannot Rejoin Secure Wi-Fi After Profile Update
    slug: sd.aplus.security.mobile_secure_wifi_profile
    category: service_desk
    priority: medium
    difficulty: easy
    pointValue: 100
    explanation: Restore the approved managed Wi-Fi/certificate configuration or hand
      off for authorized profile/certificate remediation while preserving corporate
      wireless security and MDM compliance.
    description:
      issue: The phone stopped joining the corporate secure SSID after an approved
        Wi-Fi/certificate profile update.
      reportedByLine: Avery Cole
      businessImpact: The coordinator cannot sync field work over the protected office
        network.
      troubleshooting:
      - Personal hotspot works.
      - Other corporate phones join the SSID.
      - The device shows the SSID but authentication fails.
      - MDM reports the device enrolled but the latest Wi-Fi profile is pending/failed.
      - No widespread wireless outage is reported.
      - The old certificate/profile is near expiration.
      - Confirm scope, device identity/ownership, MDM compliance, SSID/security type,
        profile/certificate status, time, and known-good comparison.
      - Identify a device-specific managed Wi-Fi/certificate/profile mismatch rather
        than a general wireless outage.
      - Use the approved MDM/profile re-push, certificate renewal, or re-enrollment
        workflow as authorized; do not downgrade wireless security or remove management
        to bypass the issue.
      - Device joins the secure SSID, authenticates, syncs the original field-work
        service, and remains MDM-compliant.
      - Record profile/certificate evidence, approved action, verification, and any
        handoff.
    requester:
      name: Avery Cole
      department: Field Operations
      email: Not specified by approved curriculum package
      contact: Not specified by approved curriculum package
      location: Not specified by approved curriculum package
    device:
      assetTag: SD.APLUS.SECURITY.MOBILE_SECURE_WIFI_PROFILE
      deviceName: FIELD-PH-17
      kind: laptop
      operatingSystem: Android Enterprise
      state: active
    sla:
      dueAt: Not specified by approved curriculum package
      target: medium
    initialWorldState:
      directoryOverlaySeeds: {}
      assetOverlaySeeds: {}
      chatMessageSeeds: []
    objectives:
    - id: professional-pending-or-completed-outcome
      description: Restore the approved managed Wi-Fi/certificate configuration or
        hand off for authorized profile/certificate remediation while preserving corporate
        wireless security and MDM compliance.
      predicateType: action_event_occurred
