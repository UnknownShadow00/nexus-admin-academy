    hints:
    - id: hint-01
      order: 1
      pointPenalty: 0
      text: Because other managed phones still connect, start by narrowing the issue
        to this device rather than changing the access point.
    - id: hint-02
      order: 2
      pointPenalty: 5
      text: Inspect the phone's MDM compliance, managed Wi-Fi profile, certificate
        status, and device time; compare them with a working corporate phone.
    - id: hint-03
      order: 3
      pointPenalty: 5
      text: If the SSID and infrastructure are healthy but the updated profile/certificate
        did not apply correctly, use the approved re-push/renewal/re-enrollment path
        instead of weakening WPA settings or deleting management.
    curriculum:
      scenario_key: sd.aplus.security.mobile_secure_wifi_profile
