      hints:
      - Because other managed phones still connect, start by narrowing the issue to
        this device rather than changing the access point.
      - Inspect the phone's MDM compliance, managed Wi-Fi profile, certificate status,
        and device time; compare them with a working corporate phone.
      - If the SSID and infrastructure are healthy but the updated profile/certificate
