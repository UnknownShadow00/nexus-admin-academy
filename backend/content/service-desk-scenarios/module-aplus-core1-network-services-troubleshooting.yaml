scenarios:
- stable_key: service_desk.aplus.network.loading_dock_wifi
  title: Loading Dock Scanners Drop Wi-Fi Every Few Minutes
  description: Handheld scanners at two loading lanes disconnect from the warehouse
    Wi-Fi every few minutes. Restarting one scanner did not fix it.
  category: service_desk
  difficulty: 1
  definition:
    id: SERVICE_DESK.APLUS.NETWORK.LOADING_DOCK_WIFI
    title: Loading Dock Scanners Drop Wi-Fi Every Few Minutes
    slug: service_desk.aplus.network.loading_dock_wifi
    category: service_desk
    priority: critical
    difficulty: easy
    pointValue: 100
    explanation: 'Resolved through an approved radio/AP/client correction and sustained
      verification.

      Escalated to network/infrastructure team with AP/channel/PoE/uplink evidence
      and a documented temporary workflow.'
    description:
      issue: Handheld scanners at two loading lanes disconnect from the warehouse
        Wi-Fi every few minutes. Restarting one scanner did not fix it.
      reportedByLine: Noah Vance
      businessImpact: Outbound orders are being recorded on paper, slowing dispatch
        and creating re-entry work. Wired packing stations remain connected.
      troubleshooting:
      - Affected scanners use Android Enterprise.
      - Wired packing stations in the same area are stable.
      - Issue expanded from one loading lane to a second.
      - A scanner is stable when used in another warehouse area.
      - Confirm exact locations/devices/time pattern and whether all affected scanners
        share an AP/band.
      - Compare a known-good scanner and a scanner moved between affected/normal locations.
      - Inspect Wi-Fi analyzer/AP health information available to role.
      - Check AP PoE/uplink/link evidence before assuming all client radios failed.
      - 'State a ranked hypothesis supported by scope: location/AP/radio interference
        or AP/uplink/power before global ISP/DNS.'
      - Keep authentication/DHCP as secondary hypotheses only if lease/auth evidence
        supports them.
      - Apply only approved low-risk client/radio/configuration action within role
        OR escalate infrastructure/channel/PoE/switch work with evidence.
      - Do not factory-reset APs or make unauthorized channel/VLAN/firewall changes.
      - Test scanners in the originally affected loading lanes long enough to reproduce
        the prior failure window.
      - Confirm business workflow connectivity, not merely an SSID association icon.
      - Record scope, AP/location comparisons, evidence, action/escalation, and verification.
      - Give dispatch a plain-language status/update and workaround if escalation
        is pending.
    requester:
      name: Noah Vance
      department: Distribution
      email: Not specified by approved curriculum package
      contact: Not specified by approved curriculum package
      location: Not specified by approved curriculum package
