scenarios:
- stable_key: service_desk.aplus.printers.hr_queue
  title: HR Onboarding Print Jobs Disappear
  description: On one HR workstation, print jobs briefly appear in the queue and then
    disappear without reaching the office MFD.
  category: service_desk
  difficulty: 1
  definition:
    id: SERVICE_DESK.APLUS.PRINTERS.HR_QUEUE
    title: HR Onboarding Print Jobs Disappear
    slug: service_desk.aplus.printers.hr_queue
    category: service_desk
    priority: medium
    difficulty: easy
    pointValue: 100
    explanation: 'Resolved through approved client queue/spooler/driver correction.

      Escalated to print-server/admin owner with complete affected-PC evidence if
      managed package/permissions block remediation.'
    description:
      issue: On one HR workstation, print jobs briefly appear in the queue and then
        disappear without reaching the office MFD.
      reportedByLine: Eli Warren
      businessImpact: HR cannot print onboarding packets for the morning orientation.
      troubleshooting:
      - Printer is powered on and its internal configuration page prints correctly.
      - The same onboarding document prints successfully from a neighboring workstation.
      - The affected workstation can reach other network resources.
      - No jam, low-consumable warning, or printer-wide error is present.
      - Confirm scope is the affected workstation and capture queue/error behavior.
      - Print an OS test page from the affected workstation.
      - Inspect selected printer/port/driver/queue and Print Spooler state according
        to role.
      - Compare with the known-good neighboring workstation/queue.
      - 'Prioritize client print path: driver/queue/spooler/port/share over printer
        mechanical hardware.'
      - Identify the exact evidence supporting the selected client-path cause.
      - Use approved queue/spooler/driver/connection remediation OR escalate managed
        driver/print-server change to admin.
      - Do not change printer hardware or clear unrelated users jobs without evidence/approval.
      - Print an OS test page after remediation.
      - Print the original onboarding packet from the affected workstation and confirm
        acceptable output.
      - Record control-group evidence, affected-PC queue behavior, action/escalation,
        both verification steps, and HR update.
