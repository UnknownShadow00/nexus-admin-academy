# Nexus Admin Academy — production deployment
#
# Compose-level variables (POSTGRES_PASSWORD, VITE_API_URL) come from a root
# `.env` file next to this compose file. Application settings come from
# `backend/.env` (see backend/.env.example).
#
# First deploy:
#   docker compose build && docker compose up -d
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python scripts/seed_users.py
#   docker compose exec backend python seed_curriculum.py

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}@postgres:5432/nexus
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${NEXUS_BACKEND_BIND:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${NEXUS_FRONTEND_BIND:-8081}:80"
    depends_on:
      backend:
        condition: service_started
      service-desk-web:
        condition: service_healthy

  # Build context is a sibling directory outside this repository; both repos must be checked out side by side on the same host.
  service-desk-web:
    build:
      context: ../Nexus dupe/service-desk-app
      dockerfile: docker/web.Dockerfile
      args:
        NEXUS_INTEGRATION: "1"
        NEXT_PUBLIC_NEXUS_INTEGRATION: "1"
        SERVICE_DESK_BASE_PATH: /service-desk
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - NEXUS_ADMIN_CHECK_URL=http://backend:8000
      - SERVICE_DESK_BASE_PATH=/service-desk
      - NEXUS_INTEGRATION=1
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/service-desk/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
