<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
  <title id="t">Simplified Windows desktop</title><desc id="d">A desktop shows a Start menu, an open browser window, and a taskbar. The operating system provides the desktop around the application.</desc>
  <rect width="720" height="270" rx="18" fill="#f8fafc"/><text x="360" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Windows provides the space for applications</text>
  <rect x="70" y="61" width="580" height="170" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><rect x="190" y="77" width="350" height="112" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="365" y="132" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f172a">Browser application</text><rect x="70" y="195" width="580" height="36" fill="#1e3a8a"/><text x="130" y="219" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">Start</text><text x="435" y="219" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">Taskbar</text>
  <text x="360" y="257" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Teaching diagram; a real Windows screen may look different.</text>
</svg>
