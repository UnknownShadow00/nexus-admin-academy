<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Three Windows tools with different purposes</title><desc id="d">Settings changes options, File Explorer finds files, and Task Manager shows running applications.</desc>
  <rect width="720" height="260" rx="18" fill="#f8fafc"/><text x="360" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Choose the right Windows tool</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="35" y="83" width="190" height="103" rx="12" fill="#dbeafe"/><text x="130" y="126">Settings</text><text x="130" y="156" font-size="15">change options</text><rect x="265" y="83" width="190" height="103" rx="12" fill="#dcfce7"/><text x="360" y="126">File Explorer</text><text x="360" y="156" font-size="15">find files</text><rect x="495" y="83" width="190" height="103" rx="12" fill="#fef3c7"/><text x="590" y="126">Task Manager</text><text x="590" y="156" font-size="15">see running apps</text></g>
  <text x="360" y="227" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Check with the user before restarting or closing their work.</text>
</svg>
