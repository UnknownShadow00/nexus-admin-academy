<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Simplified desktop computer layout</title><desc id="d">A main board connects a CPU, RAM, storage drive, and power supply. Arrows show input and output at the edges.</desc>
  <rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="360" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Inside a computer: what each part does</text>
  <rect x="120" y="65" width="480" height="190" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><text x="360" y="91" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#075985">Motherboard connects the parts</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#0f172a"><rect x="152" y="110" width="120" height="105" rx="10" fill="#bfdbfe"/><text x="212" y="150">CPU</text><text x="212" y="178">processes</text><rect x="288" y="110" width="120" height="105" rx="10" fill="#bbf7d0"/><text x="348" y="150">RAM</text><text x="348" y="178">working memory</text><rect x="424" y="110" width="140" height="105" rx="10" fill="#fde68a"/><text x="494" y="150">SSD</text><text x="494" y="178">saved storage</text></g>
  <text x="360" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Power supply gives electricity; a keyboard gives input; a screen gives output.</text>
</svg>
