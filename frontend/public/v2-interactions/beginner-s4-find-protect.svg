<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Find the file. Protect the work.</title><desc id="desc">User says: “The schedule file is gone.” Downloads → nexus-stage4-practice.txt File visible? Note name, folder, extension. Do: inspect and document.  Stop: do not move, delete, or close unsaved work.</desc><rect width="760" height="330" rx="20" fill="#eff6ff"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Find the file. Protect the work.</text><text x="28" y="71" font-family="Arial,sans-serif" font-size="14" fill="#334155">User says: “The schedule file is gone.”</text><rect x="25" y="92" width="346" height="157" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><rect x="389" y="92" width="346" height="157" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="42" y="123" font-size="19" font-weight="700">1  Check the exact path</text><text x="42" y="163" font-size="14">Downloads → nexus-stage4-practice.txt</text><text x="42" y="202" font-size="14" fill="#475569">A file in Documents is a different location.</text><text x="406" y="123" font-size="19" font-weight="700">2  Record only what you see</text><text x="406" y="163" font-size="14">File visible? Note name, folder, extension.</text><text x="406" y="202" font-size="14" fill="#475569">Absent here ≠ missing everywhere.</text></g><rect x="25" y="266" width="710" height="43" rx="12" fill="#dcfce7"/><text x="40" y="293" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#14532d">Do: inspect and document.  Stop: do not move, delete, or close unsaved work.</text></svg>
