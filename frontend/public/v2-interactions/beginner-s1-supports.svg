<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">Four places an IT problem may begin</title><desc id="d">A person in the center with four labeled areas: device, application, account, and connection.</desc>
  <rect width="720" height="250" rx="18" fill="#f8fafc"/><text x="360" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">What needs help?</text>
  <circle cx="360" cy="132" r="51" fill="#dbeafe"/><text x="360" y="139" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1e3a8a">Person</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="30" y="98" width="130" height="70" rx="12" fill="#e0f2fe"/><text x="95" y="140">Device</text><rect x="190" y="98" width="130" height="70" rx="12" fill="#dcfce7"/><text x="255" y="140">Application</text><rect x="400" y="98" width="130" height="70" rx="12" fill="#fef3c7"/><text x="465" y="140">Account</text><rect x="560" y="98" width="130" height="70" rx="12" fill="#ede9fe"/><text x="625" y="140">Connection</text></g>
  <text x="360" y="218" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Ask what the person tried before guessing where the problem is.</text>
</svg>
