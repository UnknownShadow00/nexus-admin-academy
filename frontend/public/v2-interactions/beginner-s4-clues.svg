<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">One clue at a time</title><desc id="desc">User reports: “The app froze.” Reported: the app froze earlier. Look at the app window or Task Manager. Verified: “Not reproduced during this check” is honest and useful.</desc><rect width="760" height="330" rx="20" fill="#eff6ff"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">One clue at a time</text><text x="28" y="71" font-family="Arial,sans-serif" font-size="14" fill="#334155">User reports: “The app froze.”</text><rect x="25" y="92" width="346" height="157" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><rect x="389" y="92" width="346" height="157" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="42" y="123" font-size="19" font-weight="700">Reported ≠ observed</text><text x="42" y="163" font-size="14">Reported: the app froze earlier.</text><text x="42" y="202" font-size="14" fill="#475569">Found: the window responds now.</text><text x="406" y="123" font-size="19" font-weight="700">Check safely</text><text x="406" y="163" font-size="14">Look at the app window or Task Manager.</text><text x="406" y="202" font-size="14" fill="#475569">Do not end tasks or close unsaved work.</text></g><rect x="25" y="266" width="710" height="43" rx="12" fill="#dcfce7"/><text x="40" y="293" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#14532d">Verified: “Not reproduced during this check” is honest and useful.</text></svg>
