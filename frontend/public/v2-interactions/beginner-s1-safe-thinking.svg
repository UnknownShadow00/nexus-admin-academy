<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="t d">
  <title id="t">Pause before risky changes</title><desc id="d">A decision fork: a safe check leads to test and report; risk to data or permission leads to pause and ask for help.</desc>
  <rect width="720" height="230" rx="18" fill="#f8fafc"/><text x="360" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0f172a">What is the safe next step?</text>
  <path d="M360 55v35M360 90H190v25M360 90h170v25" stroke="#64748b" stroke-width="4" fill="none"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><rect x="50" y="115" width="280" height="65" rx="12" fill="#dcfce7"/><text x="190" y="153">Safe check → test and report</text><rect x="390" y="115" width="280" height="65" rx="12" fill="#fee2e2"/><text x="530" y="153">Risk or no permission → pause</text></g>
  <text x="360" y="211" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">Never say “fixed” before checking the result.</text>
</svg>
