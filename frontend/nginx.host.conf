# Standalone frontend serving on .101 (NOT the compose config — see nginx.conf
# for the compose variant). Serves the pre-built dist/ and proxies API paths to
# the systemd backend on the host. Files are COPIED in, not bind-mounted —
# the project tree is 750 (and must stay that way: backend/.env is world-
# readable if the tree becomes traversable). Deploy / redeploy after a build:
#
#   docker run -d --name nexus-frontend --restart unless-stopped \
#     --add-host=backend-host:host-gateway -p 80:80 nginx:alpine   # first time
#   docker cp dist/. nexus-frontend:/usr/share/nginx/html/
#   docker cp nginx.host.conf nexus-frontend:/etc/nginx/conf.d/default.conf
#   docker exec nexus-frontend nginx -s reload

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Update this host/port to match where service-desk-web is deployed on the host.
    location /service-desk {
        proxy_pass http://service-desk-host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA: serve index.html for any route the filesystem doesn't know
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching (Vite hashes filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Backend proxy — dist is built with empty VITE_API_URL, so the app makes
    # relative requests and these paths carry them to the systemd backend.
    location /api/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # AI grading can take a while
        client_max_body_size 12m;  # evidence uploads (backend enforces 10MB)
    }
    location /auth/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /uploads/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend-host:8000;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
