# Standalone frontend serving on .101 (NOT the compose config — see nginx.conf
# for the compose variant). Serves the pre-built dist/ and proxies API paths to
# the systemd backend on the host. Files are COPIED in, not bind-mounted —
# the project tree is 750 (and must stay that way: backend/.env is world-
# readable if the tree becomes traversable). Deploy / redeploy after a build:
#
#   docker run -d --name nexus-frontend --restart unless-stopped \
#     --add-host=backend-host:host-gateway -p 80:80 nginx:alpine   # first time
#   docker cp dist/. nexus-frontend:/usr/share/nginx/html/
#   docker cp nginx.host.conf nexus-frontend:/etc/nginx/conf.d/default.conf
#   docker exec nexus-frontend nginx -s reload

server {
    listen 80;
    server_name _;
    # Keep redirects relative so Cloudflare remains the HTTPS authority.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Nexus remains the authentication authority for the separately deployed
    # simulator. The simulator listens only on the host loopback interface.
    location = /_service_desk_auth {
        internal;
        proxy_pass http://backend-host:8000/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
    location = /_service_desk_admin_auth {
        internal;
        proxy_pass http://backend-host:8000/api/service-desk/admin-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
    location @service_desk_login {
        return 307 /login?next=/service-desk;
    }
    location @service_desk_home {
        return 307 /service-desk;
    }

    location = /service-desk/api/health {
        proxy_pass http://nexus-service-desk:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /service-desk/_next/ {
        proxy_pass http://nexus-service-desk:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /service-desk/admin {
        auth_request /_service_desk_admin_auth;
        error_page 401 403 = @service_desk_home;
        proxy_pass http://nexus-service-desk:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
    location = /service-desk {
        auth_request /_service_desk_auth;
        error_page 401 403 = @service_desk_login;
        proxy_pass http://nexus-service-desk:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
    location ^~ /service-desk/ {
        auth_request /_service_desk_auth;
        error_page 401 403 = @service_desk_login;
        proxy_pass http://nexus-service-desk:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # SPA: serve index.html for any route the filesystem doesn't know
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching (Vite hashes filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Backend proxy — dist is built with empty VITE_API_URL, so the app makes
    # relative requests and these paths carry them to the systemd backend.
    location /api/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # AI grading can take a while
        client_max_body_size 12m;  # evidence uploads (backend enforces 10MB)
    }
    location /auth/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /uploads/ {
        proxy_pass http://backend-host:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend-host:8000;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
